<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<title>r16 - project seen by four roles</title>
<meta name="viewport" content="width=1080, height=1920">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../vendor/gsap.min.js"></script>
<script src="../kit/world.js"></script>
<style>
/* ---------- project card ---------- */
#proj{position:absolute;left:180px;top:240px;width:720px;height:460px;border-radius:40px;background:#fff;overflow:hidden}
.hd-ic{position:absolute;left:32px;top:28px;width:52px;height:52px;border-radius:16px;background:#FBEEE8}
.hd-ic i{position:absolute;left:14px;height:8px;border-radius:4px;background:#D97757}
.bar{position:absolute;border-radius:8px}
.reg{position:absolute;width:318px;height:148px;border-radius:24px;background:#F5F5F2}
#lens{position:absolute;left:32px;top:112px;width:318px;height:148px;border-radius:24px;background:#FBEEE8;border:4px solid #D97757;opacity:0}
.rc{position:absolute;width:318px;height:148px}
.rc svg{position:absolute;left:0;top:0;width:318px;height:148px;overflow:visible}
.chk{position:absolute;width:52px;height:52px;opacity:0}
.chk svg{position:absolute;left:0;top:0;width:52px;height:52px;overflow:visible}

/* ---------- role badges ---------- */
.bdg{position:absolute;top:740px;width:150px;height:150px;border-radius:72px;background:#fff;opacity:0}
.bdg .m{position:absolute;left:0;top:0;width:150px;height:150px;line-height:150px;text-align:center;font-size:42px;font-weight:700;letter-spacing:-.01em;color:#111}
.bdg .ring{position:absolute;left:-7px;top:-7px;width:164px;height:164px;border-radius:79px;border:4px solid #D97757;opacity:0}
</style></head>
<body class="split-fade">
<div id="root" data-composition-id="r16" data-start="0" data-duration="4.766667" data-width="1080" data-height="1920">
  <div id="stage"><div id="world-mask"><div id="world">

    <div id="proj" class="float">
      <!-- header: abstract app identity -->
      <div class="hd-ic"><i style="top:15px;width:24px"></i><i style="top:29px;width:16px;opacity:.55"></i></div>
      <div class="bar" style="left:104px;top:34px;width:210px;height:16px;background:#111"></div>
      <div class="bar" style="left:104px;top:62px;width:134px;height:12px;background:#E4E4E0"></div>
      <div class="bar" style="left:566px;top:36px;width:122px;height:40px;border-radius:20px;background:#F1F1EE"></div>

      <!-- region backgrounds -->
      <div class="reg" style="left:32px;top:112px"></div>
      <div class="reg" style="left:370px;top:112px"></div>
      <div class="reg" style="left:32px;top:280px"></div>
      <div class="reg" style="left:370px;top:280px"></div>

      <!-- the lens (moves between regions) -->
      <div id="lens"></div>

      <!-- R1: value / trend (CEO) -->
      <div class="rc" style="left:32px;top:112px"><svg viewBox="0 0 318 148" fill="none">
        <rect x="24" y="24" width="84" height="16" rx="8" fill="#111"/>
        <rect x="24" y="48" width="56" height="10" rx="5" fill="#D5D5D0"/>
        <path d="M24 124C60 122 84 110 118 112S172 98 202 98 252 90 294 84" stroke="#111" stroke-width="5" stroke-linecap="round"/>
        <circle cx="294" cy="84" r="7" fill="#D97757"/>
      </svg></div>
      <!-- R2: code (EM) -->
      <div class="rc" style="left:370px;top:112px"><svg viewBox="0 0 318 148" fill="none">
        <rect x="24" y="26" width="104" height="13" rx="6.5" fill="#D97757" opacity=".75"/>
        <rect x="48" y="50" width="150" height="13" rx="6.5" fill="#D0D0CB"/>
        <rect x="48" y="74" width="96" height="13" rx="6.5" fill="#D0D0CB"/>
        <rect x="48" y="98" width="184" height="13" rx="6.5" fill="#111"/>
        <rect x="24" y="122" width="62" height="13" rx="6.5" fill="#D0D0CB"/>
      </svg></div>
      <!-- R3: tests (QA) - bottom-left -->
      <div class="rc" style="left:32px;top:280px"><svg viewBox="0 0 318 148" fill="none">
        <circle cx="36" cy="38" r="11" stroke="#B9B9B4" stroke-width="3"/><rect x="62" y="32" width="150" height="12" rx="6" fill="#D0D0CB"/>
        <circle cx="36" cy="74" r="11" stroke="#B9B9B4" stroke-width="3"/><rect x="62" y="68" width="190" height="12" rx="6" fill="#D0D0CB"/>
        <circle cx="36" cy="110" r="11" stroke="#B9B9B4" stroke-width="3"/><rect x="62" y="104" width="120" height="12" rx="6" fill="#D0D0CB"/>
      </svg></div>

      <!-- R4: roadmap (PM) - bottom-right -->
      <div class="rc" style="left:370px;top:280px"><svg viewBox="0 0 318 148" fill="none">
        <rect x="24" y="26" width="132" height="22" rx="11" fill="#111"/>
        <rect x="86" y="63" width="150" height="22" rx="11" fill="#D97757"/>
        <rect x="160" y="100" width="134" height="22" rx="11" fill="#CFCFCA"/>
      </svg></div>
      <!-- green checks (top-right of each region) -->
      <div class="chk" id="k1" style="left:270px;top:126px"><svg viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="26" fill="#34C759"/><path class="kp" d="M15 27 22.5 34.5 37 18" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="36" stroke-dashoffset="36"/></svg></div>
      <div class="chk" id="k2" style="left:608px;top:126px"><svg viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="26" fill="#34C759"/><path class="kp" d="M15 27 22.5 34.5 37 18" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="36" stroke-dashoffset="36"/></svg></div>
      <div class="chk" id="k3" style="left:608px;top:294px"><svg viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="26" fill="#34C759"/><path class="kp" d="M15 27 22.5 34.5 37 18" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="36" stroke-dashoffset="36"/></svg></div>
      <div class="chk" id="k4" style="left:270px;top:294px"><svg viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="26" fill="#34C759"/><path class="kp" d="M15 27 22.5 34.5 37 18" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="36" stroke-dashoffset="36"/></svg></div>
    </div>

    <!-- role badges: prezes / kierownik zespolu / menedzer / kontrola jakosci -->
    <div class="bdg float" id="b1" style="left:195px"><div class="ring"></div><div class="m">CEO</div></div>
    <div class="bdg float" id="b2" style="left:375px"><div class="ring"></div><div class="m">EM</div></div>
    <div class="bdg float" id="b3" style="left:555px"><div class="ring"></div><div class="m">PM</div></div>
    <div class="bdg float" id="b4" style="left:735px"><div class="ring"></div><div class="m">QA</div></div>

  </div></div></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const cam = WorldKit.Camera(tl, { cx: 540, cy: 960, s: 1 });

/* ---- initial states (frame 0: card sharp & settled, badges not yet there) ---- */
gsap.set('.bdg', { opacity: 0, scale: 0.6, y: 26, transformOrigin: '50% 50%' });
gsap.set('#lens', { opacity: 0, scale: 0.96, transformOrigin: '50% 50%' });
gsap.set('.chk', { opacity: 0, scale: 0.3, transformOrigin: '50% 50%' });
gsap.set('.kp', { opacity: 0 });

/* ---- timing (narrator: prezesa 1.286 / kierownika 1.806 / menedzera 3.286 / kontroli 3.826 / jakosci 4.206) ---- */
const BADGE = [1.18, 1.74, 3.22, 3.76];       // badge pop starts (lands ~0.25 s later)
const LENS  = [{x:0,y:0}, {x:338,y:0}, {x:338,y:168}, {x:0,y:168}];   // snake: TL -> TR -> BR -> BL
const CHECK = [1.66, 2.52, 3.62, 4.30];       // green check pops

function popBadge(n, t) {
  const id = '#b' + n;
  tl.to(id, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: 'back.out(1.7)' }, t);
  tl.to(id + ' .ring', { opacity: 1, duration: 0.3, ease: 'sine.out' }, t + 0.18);
  tl.to(id + ' .m', { color: '#B25730', duration: 0.3, ease: 'sine.out' }, t + 0.18);
}
function fallBack(n, t) {
  const id = '#b' + n;
  WorldKit.dof(tl, id, 'back', t, 0.5);
  tl.to(id + ' .ring', { opacity: 0, duration: 0.3, ease: 'sine.inOut' }, t);
  tl.to(id + ' .m', { color: '#111111', duration: 0.3, ease: 'sine.inOut' }, t);
}
function tick(n, t) {
  tl.to('#k' + n, { opacity: 1, scale: 1, duration: 0.34, ease: 'back.out(2.2)' }, t);
  tl.set('#k' + n + ' .kp', { opacity: 1 }, t + 0.1);
  tl.to('#k' + n + ' .kp', { strokeDashoffset: 0, duration: 0.26, ease: 'power2.out' }, t + 0.1);
}

BADGE.forEach((t, i) => {
  popBadge(i + 1, t);
  if (i > 0) fallBack(i, t);
});

/* lens: appears on region 1, then glides region to region */
tl.to('#lens', { opacity: 1, scale: 1, duration: 0.4, ease: 'power2.out' }, 1.32);
tl.fromTo('#lens', { x: 0, y: 0 }, { x: LENS[1].x, y: LENS[1].y, duration: 0.45, ease: 'power3.inOut', immediateRender: false }, 1.80);
tl.fromTo('#lens', { x: LENS[1].x, y: LENS[1].y }, { x: LENS[2].x, y: LENS[2].y, duration: 0.45, ease: 'power3.inOut', immediateRender: false }, 3.26);
tl.fromTo('#lens', { x: LENS[2].x, y: LENS[2].y }, { x: LENS[3].x, y: LENS[3].y, duration: 0.45, ease: 'power3.inOut', immediateRender: false }, 3.82);
CHECK.forEach((t, i) => tick(i + 1, t));

/* finale: lens lets go, every badge returns to focus, all four checks stay lit */
tl.to('#lens', { opacity: 0, duration: 0.3, ease: 'sine.inOut' }, 4.42);
[1, 2, 3].forEach(n => WorldKit.dof(tl, '#b' + n, 'focus', 4.40, 0.32));
tl.to('#b4 .ring', { opacity: 0, duration: 0.3, ease: 'sine.inOut' }, 4.42);
tl.to('#b4 .m', { color: '#111111', duration: 0.3, ease: 'sine.inOut' }, 4.42);

/* ---- camera: slow steps toward the active badge (step starts ~0.25 s before the name) ---- */
cam.step(0.98, { cx: 508, cy: 960, s: 1.025 });                 // -> CEO side (prezesa 1.286)
cam.glide(1.75, 1.2, { cx: 530, cy: 958, s: 1.04 });            // EM: long phrase, slow drift
cam.step(3.04, { cx: 566, cy: 956, s: 1.055 });                 // -> PM / QA side (menedzera 3.286)

window.__timelines['r16'] = tl;
</script>
</body></html>
