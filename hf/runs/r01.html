<body class="split-fade">
<div id="root" data-composition-id="r01" data-start="0" data-duration="3.066667" data-width="1080" data-height="1920">

    <div class="dev" id="d0" style="left:60px;top:500.75px"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>

</div>
<script>
const tl = gsap.timeline({ paused: true });
const cam = WorldKit.Camera(tl, { cx: 540, cy: 960, s: 1 });
// tiny upward glide once the cover title is gone, while the team assembles
cam.glide(1.2, 1.7, { cy: 990 });

// six developer tiles emerge from behind the lockup tile and fan out into an arc
const L = [{"i":0,"cx":130,"cy":570.75,"rot":-9},{"i":1,"cx":294,"cy":494.75,"rot":-5.4},{"i":2,"cx":458,"cy":456.75,"rot":-1.8},{"i":3,"cx":622,"cy":456.75,"rot":1.8},{"i":4,"cx":786,"cy":494.75,"rot":5.4},{"i":5,"cx":950,"cy":570.75,"rot":9}];
const START0 = 1.22, STEP = 0.1, FLIGHT = 0.8;
L.forEach(t => {
  const el = document.getElementById('d' + t.i);
  const t0 = START0 + STEP * t.i;
  const sx = 540 + (t.i - 2.5) * 34, sy = 765;
  tl.fromTo(el, { x: sx - t.cx, y: sy - t.cy, scale: 0.5, rotation: 0 },
                { x: 0, y: 0, duration: FLIGHT, ease: 'power3.out', immediateRender: true }, t0);
  tl.fromTo(el, { scale: 0.5 }, { scale: 1, duration: FLIGHT * 0.8, ease: 'back.out(1.5)', immediateRender: true }, t0);
  tl.fromTo(el, { rotation: 0 }, { rotation: t.rot, duration: FLIGHT * 0.9, ease: 'power3.out', immediateRender: true }, t0);
});
window.__timelines['r01'] = tl;
</script></body></html>
