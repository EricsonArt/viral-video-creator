<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>gstack Byline</title>
<link rel="stylesheet" href="../kit/kit.css">
<script src="../vendor/gsap.min.js"></script>
<script src="../kit/world.js"></script>
<style>
  .gs{position:absolute;background:#fff;border-radius:72px;display:flex;align-items:center;justify-content:center}
  .gs .wm{font-family:'Poppins',system-ui,sans-serif;font-weight:700;color:var(--ink);letter-spacing:-.035em;line-height:1;white-space:nowrap;padding-bottom:.09em}
  .gs .wm b{font-weight:700;color:var(--clay)}

  #tile{left:190px;top:450px;width:700px;height:270px;z-index:5}
  #tile .wm{font-size:136px}
  #by{position:absolute;left:290px;top:770px;width:500px;height:192px;border-radius:56px;background:#fff;display:flex;align-items:center;justify-content:center;z-index:3}
  #av{flex:none;width:112px;height:112px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:44px;letter-spacing:.02em;padding-bottom:3px}
  #tx{margin-left:30px}
  #nm{font-weight:700;font-size:52px;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
  #sb{font-weight:400;font-size:30px;line-height:1.3;color:#6B6B66;margin-top:2px;white-space:nowrap}
</style></head>
<body class="split-fade">
<div id="root" data-composition-id="r13" data-start="0" data-duration="2.033333" data-width="1080" data-height="1920">
  <div id="stage"><div id="world-mask"><div id="world">
    <div id="by" class="float"><div id="av">GT</div><div id="tx"><div id="nm">Garry Tan</div><div id="sb">Y Combinator</div></div></div>
    <div id="tile" class="gs float"><div class="wm"><b>g</b>stack</div></div>
  </div></div></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const cam = WorldKit.Camera(tl, { cx: 540, cy: 960, s: 1 });
// byline card slides out from behind the gstack tile on "Stworzona przez"; the camera glides up a little to make room
cam.glide(0.5, 0.95, { cy: 1045 });
const T0 = 0.58, D = 0.72;
tl.fromTo('#by', { y: -281, scale: 0.86 }, { y: 0, scale: 1, duration: D, ease: 'power3.out', immediateRender: true }, T0);
gsap.set('#by', { opacity: 0 });
tl.fromTo('#by', { opacity: 0 }, { opacity: 1, duration: 0.07, ease: 'none', immediateRender: false }, T0 + 0.02);
// once the card has cleared the tile it sits in front (crisp top edge, no shadow cast on it)
tl.set('#by', { zIndex: 6 }, 0.97);
window.__timelines['r13'] = tl;
</script></body></html>
