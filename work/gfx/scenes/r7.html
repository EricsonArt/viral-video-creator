<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="lib/base.css">
<script src="lib/gsap.min.js"></script><script src="lib/world.js"></script>
<style>
#win{left:60px;top:150px;width:960px;height:720px;border-radius:40px;overflow:hidden;background:#FAF9F5}
#inner{position:absolute;left:0;top:0;width:960px;height:720px;transform-origin:0 0}
.bar{position:absolute;left:0;right:0;top:0;height:92px;border-bottom:2px solid #EEEBE3;display:flex;align-items:center;padding:0 36px;gap:18px}
.dots{display:flex;gap:12px}.dots i{width:20px;height:20px;border-radius:50%;background:#E4E1D8;display:block}
.plan{margin-left:auto;display:flex;align-items:center;gap:14px;height:56px;padding:0 24px 0 16px;border-radius:28px;background:#fff;border:2px solid #E8E5DC;font-size:30px;font-weight:600;color:#3d3d3a}
.plan .av{width:34px;height:34px;border-radius:50%;background:var(--clay);color:#fff;font-size:20px;display:grid;place-items:center;font-weight:700}
.plan .ok{width:34px;height:34px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin-right:-8px;opacity:0}
.hero{position:absolute;left:0;right:0;top:118px;display:flex;flex-direction:column;align-items:center;gap:12px}
.hero .t{font-size:52px;font-weight:700;letter-spacing:-.01em;color:#2a2a28}
.comp{position:absolute;left:60px;right:60px;top:360px;height:232px;border-radius:48px;background:#fff;border:2px solid #E8E5DC;box-shadow:0 8px 30px -18px rgba(0,0,0,.25)}
.comp .ph{position:absolute;left:44px;top:42px;font-size:34px;color:#a5a29a}
.pill{position:absolute;right:30px;bottom:28px;height:68px;padding:0 24px 0 26px;border-radius:34px;background:#F2EFE7;display:flex;align-items:center;gap:12px;font-size:30px;font-weight:600;color:#3d3d3a}
.pill svg{margin-left:4px}
.dd{position:absolute;right:90px;top:176px;width:520px;border-radius:36px;background:#fff;border:2px solid #E8E5DC;box-shadow:var(--sh);padding:14px;opacity:0;transform-origin:100% 100%}
.row{display:flex;align-items:center;height:92px;padding:0 22px;border-radius:26px;gap:16px;font-size:34px;font-weight:600;color:#3d3d3a}
.row.sel{background:var(--band)}
.row .chk{margin-left:auto}
.cur{position:absolute;left:0;top:0;width:44px;height:44px;opacity:0;z-index:5;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><filter id="mb" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB"><feGaussianBlur id="mbf" stdDeviation="0.0001 0.0001"/></filter></defs></svg>
<div id="root" data-composition-id="r7" data-width="1080" data-height="1920" data-duration="2.3" data-fps="60">
  <div id="clipper" style="-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 900px,transparent 1060px);mask-image:linear-gradient(to bottom,#000 0,#000 900px,transparent 1060px)">
    <div id="stage"><div id="world">
      <div class="card" id="win">
        <div id="inner">
          <div class="bar"><div class="dots"><i></i><i></i><i></i></div>
            <div class="plan" id="plan"><span class="av">E</span>Free plan<span class="ok" id="ok"><svg width="20" height="20" viewBox="0 0 34 34"><path d="M7 18l7 7 13-15" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div></div>
          <div class="hero"><span id="sp"></span><div class="t">How can I help you today?</div></div>
          <div class="comp"><div class="ph">Reply to Claude&hellip;</div>
            <div class="pill" id="pill"><span id="pi"></span>Sonnet 5.5<svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 8l6 6 6-6" fill="none" stroke="#3d3d3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
          <div class="dd" id="dd">
            <div class="row sel"><span class="sic"></span>Sonnet 5.5<svg class="chk" width="34" height="34" viewBox="0 0 34 34"><path d="M7 18l7 7 13-15" fill="none" stroke="#D97757" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="row"><span class="oic"></span>Opus 5.5</div>
            <div class="row"><span class="hic"></span>Haiku 4.5</div>
          </div>
          <svg class="cur" id="cur" viewBox="0 0 44 44"><path d="M8 4l26 16-11 3 7 13-6 3-7-13-9 8z" fill="#111" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div></div>
  </div>
  <div id="dither"></div>
</div>
<script type="application/json" id="events">[{"t":0.80,"type":"click","note":"cursor presses the model pill"},{"t":1.50,"type":"chime","note":"Free plan confirmed (green check)"}]</script>
<script>
document.getElementById('sp').innerHTML = HFW.spark(96, '#D97757');
document.getElementById('pi').innerHTML = HFW.spark(30, '#D97757');
document.querySelector('.sic').innerHTML = HFW.spark(36, '#D97757');
document.querySelector('.oic').innerHTML = HFW.spark(36, '#B9B9B2');
document.querySelector('.hic').innerHTML = HFW.spark(36, '#B9B9B2');
const tl = gsap.timeline({ paused: true });
HFW.init(tl, { cx: 540, cy: 510, cam: { x: 540, y: 510, s: 1 } });
/* world camera: only a slow glide (the window is the subject; the camera INSIDE the window moves) */
HFW.cam(0, 2.3, { x: 548, y: 512, s: 1.02 }, 'sine.inOut');
/* cursor travels to the model pill (pill centre ~ (760,466) in window coordinates) */
gsap.set('#cur', { x: 250, y: 640 });
tl.to('#cur', { opacity: 1, duration: .15 }, 0.2);
tl.to('#cur', { x: 742, y: 528, duration: .55, ease: 'power2.inOut' }, 0.25);
tl.to('#cur', { scale: .85, duration: .06 }, 0.80).to('#cur', { scale: 1, duration: .1 }, 0.87);
tl.to('#pill', { backgroundColor: '#E9E5D9', duration: .08 }, 0.80);
tl.to('.hero', { opacity: .12, duration: .25, ease: 'sine.inOut' }, 0.85);
/* dropdown opens */
tl.fromTo('#dd', { opacity: 0, scale: .92, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: .25, ease: 'power3.out' }, 0.82);
tl.to('#cur', { opacity: 0, duration: .2 }, 1.1);
/* camera INSIDE the window: 1.0 -> 1.25 (0.6 s, power2.inOut) toward dropdown, then settle */
tl.to('#inner', { scale: 1.25, x: -240, y: 0, duration: .6, ease: 'power2.inOut' }, 0.95);
/* Free plan confirmation on "darmowych" */
tl.to('#plan', { backgroundColor: '#EAF8EE', borderColor: '#34C759', duration: .25 }, 1.45);
gsap.set('#ok', { scale: .4 });
tl.to('#ok', { opacity: 1, scale: 1, duration: .3, ease: 'back.out(2.2)' }, 1.5);
window.__timelines['r7'] = tl;
</script></body></html>
