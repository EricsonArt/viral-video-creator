<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<link rel="stylesheet" href="fonts.css">
<script src="lib/gsap.min.js"></script>
<style>
html,body{margin:0;padding:0;background:transparent}
*{box-sizing:border-box}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Poppins',sans-serif}
.cap{position:absolute;left:0;width:1080px;text-align:center;opacity:0;white-space:nowrap;line-height:1;transform-origin:50% 50%}
.cap .w{display:inline-block;font-family:'Poppins',sans-serif;font-weight:700;font-size:74px;color:#fff;-webkit-text-stroke:10px #000;paint-order:stroke fill;letter-spacing:0;margin:0 .13em}
.cap .w.hl{font-family:'Instrument Serif',serif;font-style:italic;font-weight:700;font-size:92px;color:#FFFF00;-webkit-text-stroke:10px #000;paint-order:stroke fill;margin:0 .1em}
#cover{position:absolute;left:0;top:262px;width:1080px;display:flex;justify-content:center;opacity:1}
#cover .box{background:#fff;border-radius:30px;padding:50px 50px;box-shadow:0 60px 120px rgba(24,24,32,.16),0 24px 48px rgba(24,24,32,.10),0 4px 10px rgba(24,24,32,.06);text-align:center}
#cover .t{font-family:'Poppins',sans-serif;font-weight:700;font-size:110px;line-height:1.1;color:#000;letter-spacing:-.02em;white-space:nowrap}
/* CTA comment box (outro only) */
#cta{position:absolute;left:43px;top:1575px;width:994px;height:230px;opacity:0}
#cta .box{position:absolute;left:0;top:34px;width:994px;height:162px;border-radius:81px;background:#fff;border:3px solid #E6E3DA;box-shadow:0 60px 120px rgba(24,24,32,.16),0 24px 48px rgba(24,24,32,.10),0 4px 10px rgba(24,24,32,.06)}
#cta .av{position:absolute;left:30px;top:35px;width:92px;height:92px;border-radius:50%;background:linear-gradient(160deg,#D8D6D0,#B9B7B0);overflow:hidden}
#cta .txt{position:absolute;left:152px;top:0;height:162px;display:flex;align-items:center;font-size:58px;font-weight:500;color:#111;white-space:nowrap}
#cta .ph{color:#B1AEA5}
#cta .caret{display:inline-block;width:4px;height:68px;background:#111;margin-left:4px}
#cta .post{position:absolute;right:30px;top:35px;width:200px;height:92px;border-radius:46px;background:#D97757;color:#fff;font-size:44px;font-weight:600;display:grid;place-items:center;transform-origin:50% 50%}
</style></head><body>
<div id="root" data-composition-id="overlay" data-width="1080" data-height="1920" data-duration="%%DUR%%" data-fps="60">
  <div id="caps"></div>
  <div id="cover"><div class="box"><div class="t">Sonnet 5.5<br>bije Opusa</div></div></div>
  <div id="cta"><div class="box">
    <div class="av"><svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="36" r="17" fill="#F4F3EF"/><path d="M12 92c0-20 14-32 34-32s34 12 34 32z" fill="#F4F3EF"/></svg></div>
    <div class="txt"><span class="ph" id="ph">Add a comment&hellip;</span><span id="typed"></span><span class="caret" id="caret"></span></div>
    <div class="post" id="post">Post</div></div></div>
</div>
<script>
const D = %%DATA%%;
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  const caps = document.getElementById('caps');
  D.items.forEach((it, i) => {
    const el = document.createElement('div'); el.className = 'cap'; el.id = 'c' + i;
    el.style.top = (it.y - 46) + 'px';
    it.words.forEach(w => { const s = document.createElement('span'); s.className = 'w' + (w.hl ? ' hl' : ''); s.textContent = w.w; el.appendChild(s); });
    caps.appendChild(el);
    /* fit: never wider than 980px */
    const bw = el.scrollWidth; const wd = Array.from(el.children).reduce((a, c) => a + c.getBoundingClientRect().width + 20, 0);
    if (wd > 980) { const k = 980 / wd; Array.from(el.children).forEach(c => { c.style.fontSize = (parseFloat(getComputedStyle(c).fontSize) * k) + 'px'; }); }
    tl.set(el, { opacity: 1, scale: 0.94 }, it.start);
    tl.to(el, { scale: 1, duration: 0.09, ease: 'power2.out' }, it.start);
    tl.set(el, { opacity: 0 }, it.end);
  });
  /* cover: frame 0 only */
  tl.set('#cover', { opacity: 0 }, 0.0100);
  /* CTA comment box: appears on "wejdz w ich bio", types the keyword on "wpisz nick", presses Post on "profilu" */
  const T0 = %%CTA_T0%%, TYPE0 = %%CTA_TYPE0%%, POST = %%CTA_POST%%;
  tl.set('#cta', { opacity: 0 }, 0);
  tl.fromTo('#cta', { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: 'power3.out' }, T0);
  const word = '@nick';
  for (let k = 1; k <= word.length; k++) {
    tl.call(() => {}, null, TYPE0 + (k - 1) * 0.09);
  }
  /* typed text revealed by clip so it is seek-safe */
  const typed = document.getElementById('typed'); typed.textContent = word;
  typed.style.display = 'inline-block'; typed.style.overflow = 'hidden'; typed.style.verticalAlign = 'bottom';
  const fullW = typed.getBoundingClientRect().width; typed.style.width = '0px'; typed.style.whiteSpace = 'nowrap';
  tl.set('#ph', { display: 'none' }, TYPE0 - 0.02);
  tl.to(typed, { width: fullW, duration: 0.09 * word.length, ease: 'steps(' + word.length + ')' }, TYPE0);
  tl.fromTo('#caret', { opacity: 1 }, { opacity: 0, duration: 0.001, repeat: 12, yoyo: true, repeatDelay: 0.26 }, T0);
  /* Post pressed */
  tl.to('#post', { scale: 0.9, backgroundColor: '#B25730', duration: 0.07, ease: 'power2.out' }, POST);
  tl.to('#post', { scale: 1, duration: 0.14, ease: 'back.out(2)' }, POST + 0.08);
  window.__timelines['overlay'] = tl;
});
</script>
<script type="application/json" id="events">[{"t":39.98,"type":"key"},{"t":40.07,"type":"key"},{"t":40.16,"type":"key"},{"t":40.25,"type":"key"},{"t":40.34,"type":"key"},{"t":40.66,"type":"click","note":"Post pressed in the CTA comment box"}]</script></body></html>
