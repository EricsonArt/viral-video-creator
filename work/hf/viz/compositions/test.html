<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="../assets/lib/gsap.min.js"></script>
<style>
@font-face{font-family:Poppins;font-weight:700;src:url(../assets/fonts/Poppins-Bold.ttf)}
@font-face{font-family:Poppins;font-weight:400;src:url(../assets/fonts/Poppins-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F3F3F0}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;background:radial-gradient(ellipse 120% 80% at 50% 36%,#FFFFFF 0%,#FAFAF8 45%,#F3F3F0 100%)}
.card{position:absolute;left:140px;top:500px;width:800px;height:500px;background:#fff;border-radius:40px;
 box-shadow:0 60px 120px rgba(24,24,32,.16),0 24px 48px rgba(24,24,32,.10),0 4px 10px rgba(24,24,32,.06);
 display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:700;color:#111}
</style>
</head>
<body>
<div id="root" data-composition-id="test" data-start="0" data-duration="1" data-width="1080" data-height="1920">
  <div id="world" class="clip" data-start="0" data-duration="1" style="position:absolute;inset:0">
    <div class="card" id="c1">1,2 mln</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to("#world", { y: -300, duration: 0.5, ease: "power3.inOut" }, 0.25);
window.__timelines["test"] = tl;
</script>
</body>
</html>
