<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="assets/world.css" />
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/world.js"></script>
<style>
  .qc { left: 60px; width: 960px; height: 190px; border-radius: 40px; }
  .qc .avatar { left: 34px; top: 53px; width: 84px; height: 84px; }
  .qc .u { position: absolute; left: 146px; top: 40px; font-size: 30px; font-weight: 700; }
  .qc .t { position: absolute; left: 146px; top: 84px; width: 770px; font-size: 30px; font-weight: 400; line-height: 1.35; }
  .qc .ring { position: absolute; inset: 0; border-radius: 40px; box-shadow: inset 0 0 0 4px var(--clay); opacity: 0; }
  #q2 { z-index: 4; }
  #q2 .chk { left: 862px; top: -30px; width: 76px; height: 76px; }
  #vv { left: 330px; top: 1150px; width: 420px; height: 747px; border-radius: 13px; }
  #vv .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,0) 32%, rgba(0,0,0,0) 68%, rgba(0,0,0,.45)); }
  #hook { position: absolute; left: 26px; top: 112px; width: 368px; padding: 14px 18px 16px; border-radius: 20px; background: #fff;
          font-size: 30px; font-weight: 700; line-height: 1.2; color: var(--ink); box-shadow: 0 12px 26px rgba(0,0,0,.2); }
  #rec { position: absolute; left: 26px; top: 30px; height: 52px; padding: 0 20px 0 16px; border-radius: 26px; background: rgba(0,0,0,.38);
         display: flex; align-items: center; gap: 10px; color: #fff; font-size: 30px; font-weight: 700; }
  #rec i { display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--err); }
  #rbtn { position: absolute; left: 155px; top: 610px; width: 110px; height: 110px; border-radius: 50%; border: 7px solid #fff;
          display: flex; align-items: center; justify-content: center; }
  #rdot { width: 78px; height: 78px; border-radius: 39px; background: var(--err); }
</style>
</head>
<body>
<div id="root" data-composition-id="r11" data-start="0" data-duration="4.1" data-width="1080" data-height="1920">
  <div class="ground clip" id="ground" data-start="0" data-duration="4.1"></div>
  <div class="cam clip" id="camwrap" data-start="0" data-duration="4.1">
    <div class="world" id="world">
      <div class="card qc" id="q1" style="top:330px">
        <div class="avatar" style="background:linear-gradient(145deg,#D9E3EA,#B9C8D4)"></div>
        <div class="u">ciekawski.jan</div><div class="t">Serio TikTok płaci za wyświetlenia?</div></div>
      <div class="card qc" id="q2" style="top:560px"><div class="ring" id="ring2"></div>
        <div class="avatar" style="background:linear-gradient(145deg,#F3D9CC,#E2B8A6)"></div>
        <div class="u">salon.ewa</div><div class="t">Mam salon beauty. Jak z filmów zdobyć klientki?</div>
        <div class="chk" id="chk2"></div></div>
      <div class="card qc" id="q3" style="top:790px">
        <div class="avatar" style="background:linear-gradient(145deg,#E3ECDD,#C2D3B8)"></div>
        <div class="u">tomek99</div><div class="t">Jaki masz telefon?</div></div>

      <div class="media" id="vv"><img src="assets/thumbs/t08.jpg" /><div class="shade"></div>
        <div id="rec"><i id="recdot"></i>REC</div>
        <div id="hook">Mam salon beauty. Jak z filmów zdobyć klientki?</div>
        <div id="rbtn"><div id="rdot"></div></div>
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="camkeys">
{"anchor":[540,715],"keys":[
  {"t":0,"cx":540,"cy":655,"s":1},
  {"t":0.05,"d":2.3,"ease":"sine.inOut","cx":540,"cy":655,"s":1.03},
  {"t":2.45,"d":0.55,"ease":"power3.inOut","cx":540,"cy":1523,"s":1.0},
  {"t":3.05,"d":1.05,"ease":"sine.inOut","cx":540,"cy":1523,"s":1.03}
]}
</script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  W.camera(tl, "#world", W.readCam());
  document.getElementById("chk2").innerHTML = W.checkSVG;
  gsap.set("#chk2", { opacity: 0, scale: 0.4 });
  gsap.set("#hook", { opacity: 0, y: 24, scale: 0.94 });
  gsap.set("#rec", { opacity: 0 });
  gsap.set("#vv", { opacity: 0, y: 90 });
  tl.fromTo("#vv", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 2.42);

  // "od osoby, której naprawdę możesz pomóc": the potential client comes forward
  tl.fromTo("#q2", { scale: 1, boxShadow: "0 60px 120px rgba(24,24,32,.16), 0 24px 48px rgba(24,24,32,.10), 0 4px 10px rgba(24,24,32,.06)" }, { scale: 1.04, boxShadow: "0 80px 150px rgba(24,24,32,.20), 0 30px 60px rgba(24,24,32,.12), 0 6px 14px rgba(24,24,32,.07)", duration: 0.45, ease: "power2.inOut", immediateRender: false }, 0.86);
  tl.fromTo("#ring2", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.9);
  W.defocus(tl, "#q1", 0.9, 9, 0.4, 0.45);
  W.defocus(tl, "#q3", 0.9, 9, 0.4, 0.45);
  tl.fromTo("#chk2", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2)", immediateRender: false }, 2.1);

  // "zrób z niego następny film": the question becomes the hook of the next video, record pressed
  tl.fromTo("#hook", { opacity: 0, y: 24, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 2.72);
  tl.fromTo("#rbtn", { scale: 1 }, { scale: 0.88, duration: 0.1, ease: "power2.in", immediateRender: false }, 2.96);
  tl.fromTo("#rbtn", { scale: 0.88 }, { scale: 1, duration: 0.22, ease: "power2.out", immediateRender: false }, 3.06);
  tl.fromTo("#rdot", { width: 78, height: 78, borderRadius: 39 }, { width: 44, height: 44, borderRadius: 10, duration: 0.28, ease: "power3.inOut", immediateRender: false }, 2.98);
  tl.fromTo("#rec", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 3.1);
  tl.fromTo("#recdot", { opacity: 1 }, { opacity: 0.15, duration: 0.25, ease: "sine.inOut", immediateRender: false }, 3.55);
  tl.fromTo("#recdot", { opacity: 0.15 }, { opacity: 1, duration: 0.25, ease: "sine.inOut", immediateRender: false }, 3.8);
  window.__timelines["r11"] = tl;
</script>
</body>
</html>
