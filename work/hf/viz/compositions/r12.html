<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="assets/world.css" />
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/world.js"></script>
<style>
  #doc { left: 110px; top: 60px; width: 860px; height: 860px; border-radius: 40px; }
  #doc .avatar { left: 44px; top: 42px; width: 96px; height: 96px; }
  #doc .handle { position: absolute; left: 164px; top: 36px; }
  #doc .kind { position: absolute; left: 166px; top: 100px; font-size: 30px; font-weight: 600; color: var(--clayText); }
  #doc .rule { position: absolute; left: 44px; right: 44px; top: 176px; height: 2px; background: var(--line); }
  .mrow { position: absolute; left: 44px; width: 772px; height: 120px; }
  .mrow .label { position: absolute; left: 0; top: 14px; }
  .mrow .v { position: absolute; right: 0; top: 0; font-size: 52px; font-weight: 700; letter-spacing: -0.015em; }
  .mrow .trk { position: absolute; left: 0; top: 78px; width: 772px; height: 16px; border-radius: 8px; background: #EFEFEC; }
  .mrow .fill { position: absolute; left: 0; top: 78px; height: 16px; border-radius: 8px; background: var(--clay); transform-origin: 0 50%; }
  #blk { position: absolute; left: 24px; top: 634px; width: 812px; height: 190px; border-radius: 30px; background: var(--band); }
  #blk .dot { position: absolute; left: 32px; top: 42px; width: 22px; height: 22px; border-radius: 50%; background: var(--err);
              box-shadow: 0 0 0 8px rgba(255,59,48,.14); }
  #blk .t1 { position: absolute; left: 76px; top: 26px; font-size: 30px; font-weight: 700; color: var(--clayText); }
  #blk .t2 { position: absolute; left: 76px; top: 72px; width: 700px; font-size: 30px; font-weight: 500; line-height: 1.35; color: var(--ink); }
  .scr { left: 140px; width: 800px; height: 176px; border-radius: 40px; }
  .scr .pill { position: absolute; left: 34px; top: 30px; height: 50px; padding: 0 20px; border-radius: 25px; background: var(--clay);
               color: #fff; font-size: 30px; font-weight: 700; display: flex; align-items: center; }
  .scr .h { position: absolute; left: 34px; top: 98px; width: 600px; font-size: 30px; font-weight: 600; white-space: nowrap; }
  .scr .rb { position: absolute; right: 34px; top: 50px; width: 76px; height: 76px; border-radius: 50%; border: 5px solid #E6E6E3;
             display: flex; align-items: center; justify-content: center; }
  .scr .rb i { display: block; width: 44px; height: 44px; border-radius: 50%; background: var(--err); }
</style>
</head>
<body>
<div id="root" class="split" data-composition-id="r12" data-start="0" data-duration="6.133333" data-width="1080" data-height="1920">
  <div class="ground clip" id="ground" data-start="0" data-duration="6.133333"></div>
  <div class="cam clip" id="camwrap" data-start="0" data-duration="6.133333">
    <div class="world" id="world">
      <div class="card" id="doc">
        <div class="avatar"></div>
        <div class="handle h2">@twoje.konto</div>
        <div class="kind">Analiza profilu</div>
        <div class="rule"></div>
        <div class="mrow" style="top:212px"><div class="label">Hook w 1. sekundzie</div><div class="v"><span id="p1">0</span>%</div>
          <div class="trk"></div><div class="fill" id="f1" style="width:293px"></div></div>
        <div class="mrow" style="top:352px"><div class="label">Oglądalność do końca</div><div class="v"><span id="p2">0</span>%</div>
          <div class="trk"></div><div class="fill" id="f2" style="width:317px"></div></div>
        <div class="mrow" style="top:492px"><div class="label">Pytania od klientów</div><div class="v"><span id="p3">0</span>%</div>
          <div class="trk"></div><div class="fill" id="f3" style="width:93px"></div></div>
        <div id="blk"><div class="dot" id="bdot"></div><div class="t1">Co cię blokuje</div>
          <div class="t2">Przyciągasz ciekawskich, a nie klientów.</div></div>
      </div>

      <div class="card scr" id="s1" style="top:1010px"><div class="pill">Film 1</div><div class="h">Ile razy w tygodniu wrzucać filmy?</div><div class="rb"><i id="rd1"></i></div></div>
      <div class="card scr" id="s2" style="top:1206px"><div class="pill">Film 2</div><div class="h">Jak z filmów zdobyć klientki?</div><div class="rb"><i></i></div></div>
      <div class="card scr" id="s3" style="top:1402px"><div class="pill">Film 3</div><div class="h">Dlaczego viral nie daje klientów?</div><div class="rb"><i></i></div></div>
    </div>
  </div>
</div>

<script type="application/json" id="camkeys">
{"anchor":[540,470],"keys":[
  {"t":0,"cx":540,"cy":470,"s":1},
  {"t":0.1,"d":2.7,"ease":"sine.inOut","cx":540,"cy":452,"s":1.035},
  {"t":2.95,"d":0.6,"ease":"power3.inOut","cx":540,"cy":620,"s":1.06},
  {"t":3.9,"d":0.55,"ease":"power3.inOut","cx":540,"cy":1285,"s":1.0},
  {"t":4.5,"d":1.633333,"ease":"sine.inOut","cx":540,"cy":1285,"s":1.04}
]}
</script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  W.camera(tl, "#world", W.readCam());
  gsap.set(["#f1", "#f2", "#f3"], { scaleX: 0 });
  gsap.set("#blk", { opacity: 0 });
  gsap.set("#bdot", { scale: 0 });
  gsap.set(["#s1", "#s2", "#s3"], { opacity: 0, y: 44 });

  // "pełną, dokładną analizę twojego całego profilu": metrics fill in
  [["#f1", "#p1", 38, 0.45], ["#f2", "#p2", 41, 0.85], ["#f3", "#p3", 12, 1.25]].forEach(([f, p, v, t]) => {
    tl.fromTo(f, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut", immediateRender: false }, t);
    tl.fromTo(p, { textContent: 0 }, { textContent: v, snap: { textContent: 1 }, duration: 0.7, ease: "steps(" + Math.min(v, 14) + ")", immediateRender: false }, t);
  });
  // "co cię blokuje"
  tl.fromTo("#blk", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, 3.25);
  tl.fromTo("#bdot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, 3.52);
  // "gotowe viralowe filmiki do nagrania": step to the ready scripts
  W.defocus(tl, "#doc", 3.95, 9, 0.4, 0.5);
  [["#s1", 4.05], ["#s2", 4.19], ["#s3", 4.33]].forEach(([s, t]) => {
    tl.fromTo(s, { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, t);
  });
  tl.fromTo("#rd1", { scale: 1 }, { scale: 0.8, duration: 0.3, ease: "sine.inOut", immediateRender: false }, 5.55);
  tl.fromTo("#rd1", { scale: 0.8 }, { scale: 1, duration: 0.3, ease: "sine.inOut", immediateRender: false }, 5.85);
  window.__timelines["r12"] = tl;
</script>
</body>
</html>
