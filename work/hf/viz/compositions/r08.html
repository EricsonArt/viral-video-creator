<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="assets/world.css" />
<script src="assets/lib/gsap.min.js"></script>
<script src="assets/lib/world.js"></script>
<style>
  #mv { left: 370px; top: 168px; width: 340px; height: 604px; border-radius: 10px; z-index: 3; }
  #mv .grad { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.6)); }
  #mv .cnt { position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 10px; color: #fff; font-size: 36px; font-weight: 700; }
  #mv .cnt svg { width: 24px; height: 27px; }
  #rank { position: absolute; left: 318px; top: 118px; height: 88px; padding: 0 28px; border-radius: 44px; background: var(--clay); color: #fff;
          display: flex; align-items: center; font-size: 52px; font-weight: 700; z-index: 4;
          box-shadow: 0 24px 48px rgba(217,119,87,.32), 0 6px 14px rgba(24,24,32,.10); }
  .aud { position: absolute; border-radius: 50%; box-shadow: 0 18px 36px rgba(24,24,32,.12), 0 4px 10px rgba(24,24,32,.06); }
  .q { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: #fff; color: var(--clayText);
       display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700;
       box-shadow: 0 10px 22px rgba(24,24,32,.14), 0 2px 5px rgba(24,24,32,.08); }
</style>
</head>
<body>
<div id="root" class="split" data-composition-id="r08" data-start="0" data-duration="2.8" data-width="1080" data-height="1920">
  <div class="ground clip" id="ground" data-start="0" data-duration="2.8"></div>
  <div class="cam clip" id="camwrap" data-start="0" data-duration="2.8">
    <div class="world" id="world">
      <div id="crowd"></div>
      <div class="media" id="mv"><img src="assets/thumbs/t04.jpg" /><div class="grad"></div>
        <div class="cnt"><svg viewBox="0 0 20 22"><path d="M2 1.5v19l16.5-9.5z" fill="#fff"/></svg>486 tys.</div></div>
      <div id="rank">#1</div>
    </div>
  </div>
</div>

<script type="application/json" id="camkeys">
{"anchor":[540,470],"keys":[
  {"t":0,"cx":540,"cy":470,"s":1},
  {"t":0.05,"d":2.75,"ease":"sine.inOut","cx":540,"cy":470,"s":1.04}
]}
</script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  W.camera(tl, "#world", W.readCam());
  const tints = ["#F3D9CC,#E2B8A6", "#D9E3EA,#B9C8D4", "#E6E0F0,#C9BEDC", "#E3ECDD,#C2D3B8", "#F0E6D2,#DCCBA8"];
  // [cx, cy, size, blur, question]
  const A = [[215, 245, 104, 0, 1], [112, 400, 84, 3, 0], [262, 478, 118, 0, 0], [132, 615, 92, 2, 1], [250, 718, 80, 4, 0],
             [865, 245, 98, 0, 0], [968, 385, 80, 3, 1], [818, 470, 122, 0, 0], [952, 600, 90, 2, 0], [840, 718, 86, 4, 1]];
  const crowd = document.getElementById("crowd");
  A.forEach((a, k) => {
    const [cx, cy, sz, bl, q] = a;
    const d = document.createElement("div");
    d.className = "avatar aud"; d.id = "a" + k;
    d.style.cssText = "left:" + (cx - sz / 2) + "px;top:" + (cy - sz / 2) + "px;width:" + sz + "px;height:" + sz + "px;background:linear-gradient(145deg," + tints[k % 5] + ");filter:blur(" + bl + "px)";
    crowd.appendChild(d);
    if (q) {
      const b = document.createElement("div");
      b.className = "q"; b.id = "q" + k; b.textContent = "?";
      b.style.left = (cx + sz * 0.28) + "px"; b.style.top = (cy - sz * 0.62) + "px";
      crowd.appendChild(b);
    }
  });
  gsap.set(".aud", { opacity: 0, scale: 0.6 });
  gsap.set(".q", { opacity: 0, scale: 0.5 });
  gsap.set("#rank", { opacity: 0, scale: 0.6 });

  // "Kto ogląda": the audience appears around the video
  const order = [2, 7, 0, 5, 3, 8, 1, 6, 4, 9];
  order.forEach((k, j) => {
    tl.fromTo("#a" + k, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out", immediateRender: false }, 0.84 + j * 0.045);
  });
  [0, 3, 6, 9].forEach((k, j) => {
    tl.fromTo("#q" + k, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2)", immediateRender: false }, 1.2 + j * 0.07);
  });
  // "najpopularniejszy": rank badge
  tl.fromTo("#rank", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, 1.66);
  window.__timelines["r08"] = tl;
</script>
</body>
</html>
