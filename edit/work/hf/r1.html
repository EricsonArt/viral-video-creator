<script>

const R=HF.run("R1");
const {E,ease,mix,clamp,setText,setHTML,setStyle,blur}=HF;
const logo=HF.$("#logo"), win=HF.$("#win"), world=HF.$("#world"), ctext=HF.$("#ctext"), ub=HF.$("#ub"), ans=HF.$("#ans"), stamp=HF.$("#stamp"), send=HF.$("#send"), comp=HF.$("#comp");
const PROMPT="Daj mi 10 pomysłów na treści o marketingu";
const items=[7,8,9,10,11,12,13,14].map((i,k,a)=>{const w=R.W(i); const nx=k<a.length-1?R.W(a[k+1]).s:R.W(i).e; return {t0:w.s,t1:Math.min(nx,w.s+0.5),text:w.w};});
const ANS=["1. 5 trendów w marketingu na 2025","2. Jak zwiększyć zasięgi w mediach","3. Najlepsze narzędzia marketingowe","4. Dlaczego marketing treści działa"];
const camInit={x:540,y:530,s:1};
const camSegs=[{t0:0.15,t1:4.9,ease:"sine.inOut",to:{x:540,y:556,s:1.034}}];
const T_SEND=3.70, T_STAMP=4.12;
function frame(t){
  // --- world camera (glide only)
  HF.applyCam(world,HF.camState(camInit,camSegs,t),540,530);
  // --- logo tile: hero until 0.95, then falls back (9px / 40%) and leaves
  const lu=ease("power2.inOut",t,0.95,1.4);
  setStyle(logo,"transform","scale("+mix(1,0.7,lu).toFixed(4)+")");
  blur(logo,9*lu,1-0.6*lu*(lu<1?1:0)-(lu>=1?0.4:0)); if(lu>=1) setStyle(logo,"opacity","0");
  // --- window lands
  const wu=ease("power3.out",t,1.0,1.5);
  setStyle(win,"opacity",clamp(wu*1.4).toFixed(3));
  setStyle(win,"transform","translateY("+mix(34,0,wu).toFixed(3)+"px) scale("+mix(0.94,1,wu).toFixed(4)+")");
  // --- composer typing / send
  const typing=HF.typedWords(items,t);
  const sent=t>=T_SEND+0.05;
  const showTxt=sent?"":typing;
  const caret=(t>=items[0].t0-0.05 && !sent && t<T_SEND+0.05)?'<span class="caret"></span>':"";
  setHTML(ctext, showTxt? (showTxt+caret) : (sent?'<span class="ph">Zapytaj o cokolwiek</span>':'<span class="ph">Zapytaj o cokolwiek</span>'+(HF.caretOn(t)&&t>1.0?'<span class="caret" style="margin-left:0"></span>':"")));
  const hasText=showTxt.length>0;
  setStyle(HF.$('#hello'),'opacity',(sent||t>1.7?0:1).toFixed(2));
  send.classList.toggle("off",!hasText);
  const pr=HF.press([T_SEND],t);
  setStyle(send,"transform","scale("+(1-0.14*pr).toFixed(3)+")");
  // --- user bubble
  const bu=ease("power3.out",t,T_SEND+0.04,T_SEND+0.4);
  setText(ub,sent?PROMPT:"");
  setStyle(ub,"opacity",bu.toFixed(3)); setStyle(ub,"transform","translateY("+mix(40,0,bu).toFixed(2)+"px)");
  // --- assistant answer lines stream in
  let h="";
  ANS.forEach((a,i)=>{ const u=ease("power2.out",t,T_SEND+0.25+i*0.15,T_SEND+0.55+i*0.15); const dim=0.42*ease("power2.out",t,T_STAMP,T_STAMP+0.25); h+='<div style="opacity:'+(u*(1-dim)).toFixed(3)+';transform:translateY('+mix(14,0,u).toFixed(1)+'px)">'+a+'</div>'; });
  setHTML(ans,h);
  // --- red stamp slam
  const su=HF.prog(t,T_STAMP-0.16,T_STAMP);
  const sc=su<1?mix(1.9,1,E("power4.in")(su)):1+0.05*Math.sin(Math.PI*HF.prog(t,T_STAMP,T_STAMP+0.22));
  setStyle(stamp,"opacity",(t>=T_STAMP-0.16?clamp(su*1.6):0).toFixed(3));
  setStyle(stamp,"transform","rotate(-10deg) scale("+sc.toFixed(4)+")");
}
HF.mount("r1",4.9333333,frame);
</script>
