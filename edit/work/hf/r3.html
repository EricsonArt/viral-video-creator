<script>
const R=HF.run("R3"); const {E,ease,mix,clamp,setStyle,blur,$,prog}=HF;
const D=1160;
const world=$("#world"), gB=$("#gB"), fA=$("#fA"), inA=$("#inA"), inB=$("#inB"), logoTile=$("#logoTile");
gB.style.transform="translateX("+D+"px)"; $("#gFB").style.transform="translateX("+D+"px)";
$("#curA").innerHTML=HF.CURSOR_SVG; $("#curB").innerHTML=HF.CURSOR_SVG;

const T_LAND=0.74, T_SHARE=1.95, T_DLG=1.99, T_COPY=2.40, T_WH=2.50, WH_OUT=0.45, WH_IN=0.60;
const T_FOCUS=3.76, T_PASTE=3.80, T_GO=4.30;
const curA=[{t:1.10,x:980,y:1000},{t:1.90,x:452,y:890,ease:"power2.inOut"},{t:2.04,x:452,y:890},{t:2.36,x:790,y:512,ease:"power2.inOut"},{t:2.9,x:790,y:512}];
const clicksA=[T_SHARE,T_COPY];
const curB=[{t:3.40,x:900,y:700},{t:3.74,x:430,y:392,ease:"power2.inOut"},{t:3.9,x:430,y:392},{t:4.26,x:742,y:392,ease:"power2.inOut"},{t:4.6,x:742,y:392}];
const clicksB=[T_FOCUS,T_GO];
function camX(t){ const a=T_WH,m=a+WH_OUT,e=m+WH_IN;
  if(t<=a) return 0; if(t>=e) return -D;
  if(t<m) return -D/2*E("power3.in")((t-a)/WH_OUT);
  return -D/2-D/2*E("power3.out")((t-m)/WH_IN); }
function cursor(el,ring,pts,clicks,t,vis){
  const c=HF.cursorAt(pts,t), p=HF.press(clicks,t);
  setStyle(el,"transform","translate("+(c.x-8).toFixed(2)+"px,"+(c.y-4).toFixed(2)+"px) scale("+(1-0.12*p).toFixed(3)+")");
  setStyle(el,"opacity",vis?"1":"0");
  const r=HF.ringAt(clicks,t);
  if(r&&vis){ const s=mix(10,86,E("power2.out")(r.u)); setStyle(ring,"opacity",(0.9*(1-r.u)).toFixed(3)); setStyle(ring,"width",s.toFixed(1)+"px"); setStyle(ring,"height",s.toFixed(1)+"px"); setStyle(ring,"transform","translate("+(c.x-s/2).toFixed(1)+"px,"+(c.y-s/2).toFixed(1)+"px)"); }
  else setStyle(ring,"opacity","0");
}
function frame(t){
  setStyle(world,"transform","translate3d("+camX(t).toFixed(3)+"px,0,0)");
  // logo tile = hero until frame A lands, then falls back (9px/40%) and leaves
  const lu=ease("power2.inOut",t,T_LAND-0.05,T_LAND+0.4);
  setStyle(logoTile,"transform","scale("+mix(1,0.82,lu).toFixed(4)+")");
  blur(logoTile,9*lu, lu<1?(1-0.6*lu):0.4); if(t>T_LAND+0.55) setStyle(logoTile,"opacity","0");
  // frame A landing
  const fu=ease("power3.out",t,T_LAND,T_LAND+0.5);
  setStyle(fA,"opacity",clamp(fu*1.5).toFixed(3));
  setStyle(fA,"transform","translateY("+mix(44,0,fu).toFixed(3)+"px) scale("+mix(0.95,1,fu).toFixed(4)+")");
  const bx=ease("sine.inOut",t,T_WH+0.25,T_WH+0.95);
  setStyle($("#bdA"),"opacity",(clamp(fu*1.5)*(1-bx)).toFixed(3));
  setStyle($("#bdB"),"opacity",bx.toFixed(3));
  // share dialog
  const du=ease("power3.out",t,T_DLG,T_DLG+0.22);
  setStyle($("#shareDim"),"opacity",du.toFixed(3));
  setStyle($("#dlg"),"opacity",du.toFixed(3)); setStyle($("#dlg"),"transform","scale("+mix(0.92,1,du).toFixed(4)+")");
  const pc=HF.press([T_COPY],t);
  setStyle($("#copyBtn"),"transform","scale("+(1-0.06*pc).toFixed(3)+")"); setStyle($("#copyBtn"),"background",t>=T_COPY+0.04?"#0b4fb3":"#065fd4");
  const su=ease("power3.out",t,T_COPY+0.05,T_COPY+0.3);
  setStyle($("#snack"),"opacity",su.toFixed(3)); setStyle($("#snack"),"transform","translateY("+mix(30,0,su).toFixed(2)+"px)");
  cursor($("#curA"),$("#ringA"),curA,clicksA,t,t>=1.10&&t<T_WH+WH_OUT+0.3);
  // frame B: real page states + internal camera
  const zu=ease("power2.inOut",t,3.62,4.22);
  setStyle(inB,"transform","scale("+mix(1,1.2,zu).toFixed(4)+")");
  setStyle($("#pgPasted"),"opacity",clamp((t-T_PASTE)/0.05).toFixed(2));
  setStyle($("#pgGo"),"opacity",clamp((t-T_GO)/0.05).toFixed(2));
  cursor($("#curB"),$("#ringB"),curB,clicksB,t,t>=3.40);
}
