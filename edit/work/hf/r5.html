<!doctype html>
<html lang="pl" data-resolution="portrait">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/>
<link rel="stylesheet" href="assets/base.css"/>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/plan.js"></script>
<script src="assets/lib.js"></script>
<style>
.bd{position:absolute;width:1860px;height:1874px;left:-390px;top:-217px;object-fit:cover}
#win{left:24px;top:200px;width:1032px;height:1040px;border-radius:40px;position:absolute}
.inner{position:absolute;left:0;top:0;width:1032px;height:1040px;transform-origin:560px 900px}
#hello{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:62px;font-weight:500;color:#0d0d0d;letter-spacing:-.01em}
.comp2{position:absolute;left:30px;right:30px;bottom:38px;background:#f4f4f4;border-radius:58px;padding:26px 26px 26px 30px;display:flex;flex-direction:column;gap:18px;font-family:Inter,sans-serif}
.comp2 .row{display:flex;align-items:center;gap:18px;min-height:76px}
.comp2 .txt{flex:1;font-size:37px;line-height:1.32;color:#0d0d0d}
.chip{width:440px;height:116px;border-radius:30px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;align-items:center;gap:20px;padding:0 24px;transform-origin:0 100%}
.chip .ic{width:68px;height:68px;border-radius:18px;background:#fbeee8;display:flex;align-items:center;justify-content:center;flex:none}
.chip .t1{font-size:32px;font-weight:500;color:#0d0d0d;line-height:1.2}
.chip .t2{font-size:30px;color:#6b6b6b;line-height:1.2}
#ub2{position:absolute;right:36px;top:150px;max-width:860px}
.ubub{background:#f4f4f4;border-radius:36px;padding:24px 34px;font:400 37px/1.38 Inter,sans-serif;color:#0d0d0d}
#chipDone{position:absolute;right:36px;top:128px}
#think{position:absolute;left:44px;top:470px;display:flex;gap:12px}
#think i{width:20px;height:20px;border-radius:50%;background:#bdbdbd;display:block}
</style></head>
<body>
<div id="root" class="visual" data-composition-id="r5" data-start="0" data-duration="4.1" data-width="1080" data-height="1920">
 <div id="world-mask"><div id="world">
  <img class="bd" id="bd" src="assets/bd_gpt.png"/>
  <div id="win" class="gpt"><div class="inner" id="inner">
    <div class="bar"><div class="model"><svg viewBox="0 0 24 24"><path fill="#0d0d0d" d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944z"/></svg><span>ChatGPT</span><svg viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M6 9l6 6 6-6" fill="none" stroke="#8e8e8e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div style="display:flex;gap:22px;align-items:center"><div style="width:54px;height:54px;border-radius:50%;background:#f4f4f4"></div><div style="width:54px;height:54px;border-radius:50%;background:#e9e9e9"></div></div></div>
    <div id="hello">W czym mogę pomóc?</div>
    <div id="chipDone" class="chip" style="opacity:0"><div class="ic"><svg viewBox="0 0 24 24" width="38" height="38"><path d="M7 3h7l5 5v13H7z M14 3v5h5 M10 13h6 M10 17h6" fill="none" stroke="#B25730" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg></div><div><div class="t1">Wklejony tekst</div><div class="t2">Transkrypcja filmu</div></div></div>
    <div id="ub2" class="ubub" style="opacity:0"></div>
    <div id="think" style="opacity:0"><i></i><i></i><i></i></div>
    <div class="comp2" id="comp2">
      <div id="chipWrap" style="height:0;overflow:visible"></div>
      <div class="row">
        <div class="plus" style="width:66px;height:66px;display:flex;align-items:center;justify-content:center;flex:none"><svg viewBox="0 0 24 24" width="42" height="42"><path d="M12 5v14M5 12h14" stroke="#555" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <div class="txt" id="txt"></div>
        <div class="send off" id="send" style="width:78px;height:78px;border-radius:50%;background:#0d0d0d;display:flex;align-items:center;justify-content:center;flex:none"><svg viewBox="0 0 24 24" width="40" height="40"><path d="M12 19V6M6 11.5l6-6 6 6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>
    <div class="cursor" id="cur"></div><div class="ring" id="ring"></div>
  </div></div>
 </div></div>
</div>
<script>
const R=HF.run("R5"); const {E,ease,mix,clamp,setStyle,setHTML,setText,blur,$,prog}=HF;
$("#cur").innerHTML=HF.CURSOR_SVG;
const PROMPT="Daj mi 5 pomysłów na viralowe filmiki na podstawie tego filmu";
const w=(i)=>R.W(i);
// typed words synced to narration (poproś o 5 pomysłów na viralowe filmiki na podstawie tego filmu)
const items=[
 {t0:w(61).s,t1:w(61).e,text:"Daj"},{t0:w(61).s+0.12,t1:w(61).e,text:"mi"},
 {t0:w(63).s,t1:w(63).e,text:"5"},{t0:w(64).s,t1:w(64).e,text:"pomysłów"},{t0:w(65).s,t1:w(65).e,text:"na"},
 {t0:w(66).s,t1:w(66).e,text:"viralowe"},{t0:w(67).s,t1:w(67).e,text:"filmiki"},
 {t0:w(68).s,t1:w(68).e,text:"na"},{t0:w(69).s,t1:w(69).s+0.34,text:"podstawie"},{t0:w(70).s,t1:w(70).e,text:"tego"},{t0:w(71).s,t1:w(71).e-0.05,text:"filmu"}];
const T_CHIP=0.42, T_SEND=3.86;
const chipHTML='<div class="chip"><div class="ic"><svg viewBox="0 0 24 24" width="38" height="38"><path d="M7 3h7l5 5v13H7z M14 3v5h5 M10 13h6 M10 17h6" fill="none" stroke="#B25730" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg></div><div><div class="t1">Wklejony tekst</div><div class="t2">Transkrypcja filmu</div></div></div>';
const curP=[{t:0.0,x:900,y:760},{t:0.30,x:800,y:880,ease:"power2.out"},{t:3.75,x:800,y:880},{t:3.86,x:956,y:944,ease:"power2.inOut"},{t:4.1,x:956,y:944}];
function frame(t){
  // product window stays still; camera moves INSIDE the window
  const z1=ease("power2.inOut",t,0.30,0.88), z2=ease("power2.inOut",t,3.60,4.05);
  const s=mix(1,1.15,z1);
  setStyle($("#inner"),"transform","scale("+mix(s,1.0,0).toFixed(4)+")");
  const sent=t>=T_SEND+0.06;
  // attachment chip lands in composer (paste)
  const cu=ease("power3.out",t,T_CHIP,T_CHIP+0.28);
  $("#chipWrap").innerHTML=(t>=T_CHIP&&!sent)?'<div style="transform:scale('+mix(0.9,1,cu).toFixed(3)+');opacity:'+clamp(cu*1.5).toFixed(2)+';transform-origin:0 100%;margin-bottom:0">'+chipHTML+'</div>':"";
  setStyle($("#chipWrap"),"height",(t>=T_CHIP&&!sent)?(116*clamp(cu*1.6)).toFixed(1)+"px":"0px");
  // typing
  const typing=sent?"":HF.typedWords(items,t);
  const caret=(!sent&&t>=T_CHIP)?'<span class="caret"></span>':"";
  setHTML($("#txt"),typing?(typing+caret):'<span style="color:#8e8e8e">Zapytaj o cokolwiek</span>'+(HF.caretOn(t)&&!sent?'<span class="caret" style="margin-left:0"></span>':""));
  $("#send").classList.toggle("off",!(typing.length>0));
  setStyle($("#send"),"background",typing.length>0?"#0d0d0d":"#d6d6d6");
  const pr=HF.press([T_SEND],t); setStyle($("#send"),"transform","scale("+(1-0.14*pr).toFixed(3)+")");
  // hello fades once content begins
  setStyle($("#hello"),"opacity",(1-clamp((t-0.6)/0.3)).toFixed(3));
  // sent: user bubble + chip above, thinking dots
  const bu=ease("power3.out",t,T_SEND+0.06,T_SEND+0.34);
  setText($("#ub2"),sent?PROMPT:""); setStyle($("#ub2"),"opacity",bu.toFixed(3)); setStyle($("#ub2"),"transform","translateY("+mix(30,0,bu).toFixed(2)+"px)");
  setStyle($("#chipDone"),"opacity",bu.toFixed(3)); setStyle($("#chipDone"),"top","128px"); setStyle($("#ub2"),"top","268px");
  const du=ease("power2.out",t,T_SEND+0.25,T_SEND+0.4);
  setStyle($("#think"),"opacity",du.toFixed(3)); setStyle($("#think"),"top","470px");
  $$("#think i").forEach((el,i)=>setStyle(el,"opacity",(0.35+0.65*Math.max(0,Math.sin((t*5)-i*0.8))).toFixed(2)));
  // cursor
  const c=HF.cursorAt(curP,t), pc=HF.press([T_SEND],t);
  setStyle($("#cur"),"transform","translate("+(c.x-8).toFixed(2)+"px,"+(c.y-4).toFixed(2)+"px) scale("+(1-0.12*pc).toFixed(3)+")");
  setStyle($("#cur"),"opacity",(t>=0.05&&t<4.09)?"1":"0");
  const r=HF.ringAt([T_SEND],t);
  if(r){const s2=mix(10,90,E("power2.out")(r.u)); setStyle($("#ring"),"opacity",(0.9*(1-r.u)).toFixed(3)); setStyle($("#ring"),"width",s2.toFixed(1)+"px"); setStyle($("#ring"),"height",s2.toFixed(1)+"px"); setStyle($("#ring"),"transform","translate("+(c.x-s2/2).toFixed(1)+"px,"+(c.y-s2/2).toFixed(1)+"px)");} else setStyle($("#ring"),"opacity","0");
}
const $$=HF.$$;
HF.mount("r5",4.1,frame);
</script>
</body></html>
